<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fed"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png"><title>Messenger</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#16181d;--mute:#7a8190;--me:#2f6fed;--them:#e8eaef;--line:#dfe2e8;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#101216;--card:#181b21;--text:#eceef2;--mute:#8b93a3;--me:#3b7bff;--them:#252a33;--line:#2a2f39}}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
header button{background:none;color:var(--mute);padding:0}
#list{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--them);white-space:pre-wrap;word-wrap:break-word;align-self:flex-start}
.m.me{cursor:pointer;align-self:flex-end;background:var(--me);color:#fff}
.m small{display:block;font-size:11px;opacity:.65;text-align:right}
.bar{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
textarea,input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:18px;padding:10px 14px;font:inherit}
textarea{resize:none;max-height:110px}
button{border:0;background:var(--me);color:#fff;border-radius:18px;padding:10px 18px;font:inherit;font-weight:600}
#auth{margin:auto;width:min(340px,90%);display:flex;flex-direction:column;gap:10px;text-align:center}
#auth h2{margin:0 0 6px}#err{color:#e5484d;font-size:14px;min-height:20px}
.sec{background:none;color:var(--me)}
#ty{font-size:12px;color:var(--me);min-height:16px}#lock{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#lock[hidden]{display:none}#lt{font-weight:600;font-size:18px}#ld{display:flex;gap:14px}
#ld i{width:14px;height:14px;border-radius:50%;border:2px solid var(--me)}#ld i.f{background:var(--me)}
#lm{color:#e5484d;min-height:20px;font-size:14px}
#pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
#pad button{height:64px;border-radius:50%;background:var(--card);color:var(--text);border:1px solid var(--line);font-size:24px;padding:0}
#lf{background:none;color:var(--mute);font-size:14px}
</style></head><body>
<div id="auth"><h2>💬 Messenger</h2>
<input id="em" type="text" placeholder="Login" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
<input id="pw" type="password" placeholder="Parol (kamida 6 belgi)" autocomplete="current-password">
<div id="err"></div>
<button id="in">Kirish</button><button id="up" class="sec">Ro‘yxatdan o‘tish</button></div>
<header hidden id="hd"><div><b>💬 Messenger</b><div id="ty"></div></div><button id="out">Chiqish</button></header>
<div id="list" hidden></div>
<div class="bar" hidden id="bar"><textarea id="t" rows="1" placeholder="Xabar yozing…"></textarea><button id="s">➤</button></div>
<div id="lock" hidden><div id="lt"></div><div id="ld"><i></i><i></i><i></i><i></i></div><div id="lm"></div>
<div id="pad"></div><button id="lf">Kodni unutdim</button></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,addDoc,query,orderBy,limit,onSnapshot,doc,setDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCUHh0ULEcQ9BbuKpkwRPhty3nY9Te_j6g",authDomain:"messenger15-08.firebaseapp.com",projectId:"messenger15-08",storageBucket:"messenger15-08.firebasestorage.app",messagingSenderId:"730505193895",appId:"1:730505193895:web:afd3e545a6314988652e82"});
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);let unsub=null;
const msg=e=>({"auth/invalid-credential":"Login yoki parol noto‘g‘ri","auth/email-already-in-use":"Bu login band, “Kirish”ni bosing","auth/weak-password":"Parol kamida 6 belgi bo‘lsin","auth/invalid-email":"Email noto‘g‘ri","auth/too-many-requests":"Juda ko‘p urinish. 10–15 daqiqa kuting"}[e.code]||"Xato: "+e.code);
const U=['shahriyor08','dilruza15'];
const go=f=>async()=>{$('err').textContent='';const n=$('em').value.trim().toLowerCase();if(!U.includes(n)){$('err').textContent='Bunday login yo‘q';return}try{await f(auth,n+'@messenger.app',$('pw').value)}catch(e){$('err').textContent=msg(e)}};
$('in').onclick=go(signInWithEmailAndPassword);$('up').onclick=go(createUserWithEmailAndPassword);
$('out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
 const on=!!u;if(on)lockInit();else $('lock').hidden=true;$('auth').hidden=on;['hd','list','bar'].forEach(i=>$(i).hidden=!on);
 if(unsub){unsub();unsub=null}
 if(!on)return;
 const q=query(collection(db,'messages'),orderBy('t'),limit(300));
 unsub=onSnapshot(q,s=>{
  const l=$('list'),near=l.scrollHeight-l.scrollTop-l.clientHeight<80||!l.children.length;
  l.textContent='';
  s.forEach(d=>{const x=d.data(),e=document.createElement('div');e.className='m'+(x.uid===u.uid?' me':'');e.textContent=x.text;if(x.uid===u.uid)e.onclick=()=>{if(confirm('Xabar ikkala tomondan o‘chirilsinmi?'))deleteDoc(doc(db,'messages',d.id)).catch(()=>alert('O‘chirib bo‘lmadi'))};
   const m=document.createElement('small');m.textContent=new Date(x.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});e.appendChild(m);l.appendChild(e)});
  if(near)l.scrollTop=l.scrollHeight;
 },e=>{$('list').textContent='Ruxsat yo‘q yoki xato: '+e.code});
});
async function send(){const v=$('t').value.trim();if(!v||!auth.currentUser)return;$('t').value='';lastTy=0;setTy(0);
 try{await addDoc(collection(db,'messages'),{text:v,uid:auth.currentUser.uid,t:Date.now()})}catch(e){$('t').value=v}}
$('s').onclick=send;
$('t').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
/* ---- Kirish kodi (PIN) ---- */
const K='pinh',enc=async p=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('msgr:'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let buf='',mode='',first='',fails=0,until=0,hiddenAt=0;
const pad=$('pad');['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>{const b=document.createElement('button');b.textContent=k;if(!k)b.style.visibility='hidden';b.onclick=()=>key(k);pad.appendChild(b)});
const draw=()=>[...$('ld').children].forEach((d,i)=>d.className=i<buf.length?'f':'');
const title=()=>$('lt').textContent={set:'Yangi kod o‘rnating',again:'Kodni qayta kiriting',open:'Kirish kodini kiriting'}[mode];
function lockInit(){buf='';first='';mode=localStorage.getItem(K)?'open':'set';$('lm').textContent='';$('lf').hidden=mode!=='open';$('lock').hidden=false;title();draw()}
async function key(k){
 if(Date.now()<until){$('lm').textContent='Biroz kuting…';return}
 if(k==='⌫')buf=buf.slice(0,-1);else if(buf.length<4)buf+=k;
 draw();if(buf.length<4)return;
 const v=buf;buf='';
 if(mode==='set'){first=v;mode='again';$('lm').textContent='';}
 else if(mode==='again'){if(v===first){localStorage.setItem(K,await enc(v));$('lock').hidden=true;fails=0}else{mode='set';$('lm').textContent='Kodlar mos kelmadi';}}
 else if(await enc(v)===localStorage.getItem(K)){$('lock').hidden=true;fails=0;$('lm').textContent=''}
 else{$('lm').textContent='Kod noto‘g‘ri';if(++fails>=5){until=Date.now()+30000;fails=0;$('lm').textContent='5 marta xato. 30 soniya kuting'}}
 title();draw()}
$('lf').onclick=async()=>{if(confirm('Kod o‘chiriladi va qayta email/parol bilan kirasiz. Davom etasizmi?')){localStorage.removeItem(K);await signOut(auth);$('lock').hidden=true}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(auth.currentUser&&hiddenAt&&Date.now()-hiddenAt>15000&&localStorage.getItem(K))lockInit()});
/* ---- Yozmoqda… ko‘rsatkichi ---- */
let tyUnsub=null,tyMap={},lastTy=0;
const setTy=v=>{const u=auth.currentUser;if(u)setDoc(doc(db,'typing',u.uid),{t:v}).catch(()=>{})};
const showTy=()=>{$('ty').textContent=Object.values(tyMap).some(t=>Date.now()-t<5000)?'yozmoqda…':''};
setInterval(showTy,1000);
$('t').addEventListener('input',()=>{const n=Date.now();if($('t').value.trim()===''){lastTy=0;setTy(0)}else if(n-lastTy>2000){lastTy=n;setTy(n)}});
onAuthStateChanged(auth,u=>{if(tyUnsub){tyUnsub();tyUnsub=null}tyMap={};showTy();if(!u)return;
 tyUnsub=onSnapshot(collection(db,'typing'),s=>{tyMap={};s.forEach(d=>{if(d.id!==u.uid)tyMap[d.id]=d.data().t||0});showTy()},()=>{})});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
